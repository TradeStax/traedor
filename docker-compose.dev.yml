version: '3.8'

# Development override file
# Use with: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # PostgreSQL Database (same as production)
  postgres:
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d

  # Go Backend with hot reload
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
    volumes:
      - .:/app
      - /app/bin  # Exclude bin directory
    environment:
      - DATABASE_URL=postgres://traedor:traedor_password@postgres:5432/traedor?sslmode=disable
      - CGO_ENABLED=0
    command: >
      sh -c "
        if command -v air > /dev/null 2>&1; then
          air -c .air.toml
        else
          go run . --api
        fi
      "

  # React Frontend with hot reload
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
    command: npm run dev

volumes:
  postgres_dev_data:
    driver: local